schemaVersion = 2

[services.squadsync-db]
  type = "postgres"

[services.squadsync-api]
  [services.squadsync-api.build]
    dockerfilePath = "backend/Dockerfile"
  [services.squadsync-api.deploy]
    healthcheckPath = "/ready"
    healthcheckTimeout = 15
  [services.squadsync-api.source]
    watchPatterns = ["backend/**"]
  [services.squadsync-api.variables]
    SECRET_KEY = "${{ SECRET_KEY }}"
    ALGORITHM = "HS256"
    ACCESS_TOKEN_EXPIRE_MINUTES = "1440"
    FRONTEND_URL = "${{ FRONTEND_URL }}"
    PUBLIC_API_URL = "${{ PUBLIC_API_URL }}"
    NOSTR_RELAYS = "wss://relay.damus.io,wss://nos.lol,wss://relay.nostr.band"

[services.squadsync-web]
  [services.squadsync-web.build]
    dockerfilePath = "frontend/Dockerfile"
    [services.squadsync-web.build.args]
      NEXT_PUBLIC_API_URL = "${{ NEXT_PUBLIC_API_URL }}"
  [services.squadsync-web.deploy]
    healthcheckPath = "/"
    healthcheckTimeout = 15
  [services.squadsync-web.source]
    watchPatterns = ["frontend/**"]
  [services.squadsync-web.variables]
    NEXT_PUBLIC_API_URL = "${{ NEXT_PUBLIC_API_URL }}"
    AUTH_SECRET = "${{ AUTH_SECRET }}"
